<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d2535">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='8' fill='%2300ff88'/><circle cx='16' cy='16' r='8' fill='%2300ff88' opacity='0.3' filter='blur(4px)'/></svg>">
    <title>thegeekpad</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            background-color: #0d2535;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background-color: #0d2535;
            background: linear-gradient(135deg, #0a1f2e, #1a3a4a, #0d2535);
        }
        
        h1 {
            font-size: clamp(2em, 8vw, 4em);
            background: linear-gradient(90deg, #00d4ff, #00f5d4, #00ff88, #00d4ff, #00f5d4);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            text-align: center;
            animation: gradient 10s linear infinite;
        }
        
        @keyframes gradient {
            0% {
                background-position: 0% center;
            }
            100% {
                background-position: 200% center;
            }
        }
        
        #swarm {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <h1>thegeekpad</h1>
    <canvas id="swarm"></canvas>
    <script>
        // =================
        // CONFIGURATION
        // =================
        
        // Physics
        const MAX_SPEED = 5;
        const DRAG = 0.995;
        const SOFT_BOUNDARY = 50;
        const SOFT_BOUNDARY_PUSH = 0.1;
        
        // Exploration
        const EXPLORE_THRUST_INTERVAL_MIN = 1000;
        const EXPLORE_THRUST_INTERVAL_MAX = 3000;
        const EXPLORE_THRUST_STRENGTH = 0.8;
        
        // Plume particles
        const PLUME_VELOCITY_MULT = 2;
        const PLUME_SPREAD = 0.5;
        const PLUME_FADE_RATE = 0.05;
        const PLUME_LIFE = 20;
        
        // Swarm
        const PIXEL_COUNT = 100;
        
        // Title avoidance
        const TITLE_AVOIDANCE_DISTANCE = 10;
        const TITLE_FLEE_THRUST = 1.2;
        
        // =================
        // MOUSE PHYSICS
        // =================
        
        const MOUSE_ATTRACTION_STRENGTH = 0.05;
        const MOUSE_REPEL_STRENGTH = 2.0;
        const MOUSE_REPEL_RADIUS = 150;
        const MOUSE_ATTRACTION_RADIUS = 300;
        const CLICK_REPEL_STRENGTH = 8.0;
        const CLICK_REPEL_RADIUS = 200;
        
        let mouseX = -1000;
        let mouseY = -1000;
        let mouseActive = false;
        let clickRepelX = -1000;
        let clickRepelY = -1000;
        let clickRepelActive = false;
        let clickRepelLife = 0;
        
        // Track mouse position
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            mouseActive = true;
        });
        
        document.addEventListener('mouseleave', () => {
            mouseActive = false;
        });
        
        // Click repulsion burst
        document.addEventListener('click', (e) => {
            clickRepelX = e.clientX;
            clickRepelY = e.clientY;
            clickRepelActive = true;
            clickRepelLife = 15;
            
            // Visual feedback - brief flash
            const flash = document.createElement('div');
            flash.style.cssText = `
                position: fixed;
                left: ${e.clientX}px;
                top: ${e.clientY}px;
                width: 20px;
                height: 20px;
                border: 2px solid rgba(0, 255, 136, 0.8);
                border-radius: 50%;
                pointer-events: none;
                transform: translate(-50%, -50%) scale(0);
                animation: clickBurst 0.4s ease-out forwards;
                z-index: 999;
            `;
            document.body.appendChild(flash);
            setTimeout(() => flash.remove(), 400);
        });
        
        // Add click burst animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes clickBurst {
                0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
                100% { transform: translate(-50%, -50%) scale(4); opacity: 0; }
            }
        `;
        document.head.appendChild(style);
        
        // Mouse force application function
        function applyMouseForce(pixel) {
            if (!mouseActive) return;
            
            const dx = mouseX - pixel.x;
            const dy = mouseY - pixel.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            // Attraction when mouse is near (but not too close - avoid collision)
            if (dist < MOUSE_ATTRACTION_RADIUS && dist > 50) {
                const strength = MOUSE_ATTRACTION_STRENGTH * (1 - dist / MOUSE_ATTRACTION_RADIUS);
                pixel.vx += (dx / dist) * strength;
                pixel.vy += (dy / dist) * strength;
            }
            
            // Repulsion when mouse is very close
            if (dist < 50) {
                const strength = MOUSE_REPEL_STRENGTH * (1 - dist / 50);
                pixel.vx -= (dx / dist) * strength;
                pixel.vy -= (dy / dist) * strength;
            }
        }
        
        function applyClickRepel(pixel) {
            if (!clickRepelActive) return;
            
            const dx = pixel.x - clickRepelX;
            const dy = pixel.y - clickRepelY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist < CLICK_REPEL_RADIUS) {
                const strength = CLICK_REPEL_STRENGTH * (1 - dist / CLICK_REPEL_RADIUS);
                pixel.vx += (dx / dist) * strength;
                pixel.vy += (dy / dist) * strength;
            }
        }
        
        // Decrease click repel over time
        function updateClickRepel() {
            if (clickRepelActive) {
                clickRepelLife--;
                if (clickRepelLife <= 0) {
                    clickRepelActive = false;
                }
            }
        }
        
        // =================
        // INITIALIZATION
        // =================
        
        const titleEl = document.querySelector('h1');
        const canvas = document.getElementById('swarm');
        const ctx = canvas.getContext('2d');
        
        const PIXEL_SIZE = 4;
        const PLUME_SIZE = 2;
        const GLOW_COLOR = '#00ff88';
        
        let viewWidth = window.innerWidth;
        let viewHeight = window.innerHeight;
        let dpr = window.devicePixelRatio || 1;
        
        function resizeCanvas() {
            viewWidth = window.innerWidth;
            viewHeight = window.innerHeight;
            dpr = window.devicePixelRatio || 1;
            canvas.width = Math.round(viewWidth * dpr);
            canvas.height = Math.round(viewHeight * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Pre-render the glowing pixel once (matches the old 10px + 20px box-shadow glow)
        // so each frame is a cheap drawImage instead of a per-pixel shadowBlur
        const GLOW_PAD = 40;
        const SPRITE_SIZE = PIXEL_SIZE + GLOW_PAD * 2;
        const sprite = document.createElement('canvas');
        function renderSprite() {
            sprite.width = sprite.height = Math.ceil(SPRITE_SIZE * dpr);
            const sctx = sprite.getContext('2d');
            sctx.scale(dpr, dpr);
            const c = SPRITE_SIZE / 2;
            sctx.fillStyle = GLOW_COLOR;
            sctx.shadowColor = GLOW_COLOR;
            [20, 10].forEach(blur => {
                sctx.shadowBlur = blur * dpr;
                sctx.beginPath();
                sctx.arc(c, c, PIXEL_SIZE / 2, 0, Math.PI * 2);
                sctx.fill();
            });
        }
        renderSprite();
        let spriteDpr = dpr;
        
        // Create pixel swarm
        const pixels = [];
        for (let i = 0; i < PIXEL_COUNT; i++) {
            pixels.push({
                x: Math.random() * viewWidth,
                y: Math.random() * viewHeight,
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2,
                nextThrustTime: Date.now() + Math.random() * EXPLORE_THRUST_INTERVAL_MAX
            });
        }
        
        const plumes = [];
        
        function animate() {
            const now = Date.now();
            
            // Read title boundaries once per frame, not once per pixel
            const titleRect = titleEl.getBoundingClientRect();
            
            // Update each pixel
            pixels.forEach(pixel => {
                // Avoid the title if too close
                const closestX = Math.max(titleRect.left, Math.min(pixel.x, titleRect.right));
                const closestY = Math.max(titleRect.top, Math.min(pixel.y, titleRect.bottom));
                const dx = pixel.x - closestX;
                const dy = pixel.y - closestY;
                const distToTitle = Math.sqrt(dx * dx + dy * dy);
                
                if (distToTitle < TITLE_AVOIDANCE_DISTANCE) {
                    let fleeX, fleeY;
                    if (distToTitle < 0.1) {
                        // Pixel is inside title - flee in random direction
                        const angle = Math.random() * Math.PI * 2;
                        fleeX = Math.cos(angle) * TITLE_FLEE_THRUST;
                        fleeY = Math.sin(angle) * TITLE_FLEE_THRUST;
                    } else {
                        fleeX = (dx / distToTitle) * TITLE_FLEE_THRUST;
                        fleeY = (dy / distToTitle) * TITLE_FLEE_THRUST;
                    }
                    pixel.vx += fleeX;
                    pixel.vy += fleeY;
                    createPlume(pixel.x, pixel.y, fleeX, fleeY);
                }
                
                // Apply mouse physics
                applyMouseForce(pixel);
                if (clickRepelActive) {
                    applyClickRepel(pixel);
                }
                
                // Exploration behavior - thrust in random directions
                if (now > pixel.nextThrustTime) {
                    const angle = Math.random() * Math.PI * 2;
                    const thrustX = Math.cos(angle) * EXPLORE_THRUST_STRENGTH;
                    const thrustY = Math.sin(angle) * EXPLORE_THRUST_STRENGTH;
                    pixel.vx += thrustX;
                    pixel.vy += thrustY;
                    createPlume(pixel.x, pixel.y, thrustX, thrustY);
                    pixel.nextThrustTime = now + EXPLORE_THRUST_INTERVAL_MIN + Math.random() * (EXPLORE_THRUST_INTERVAL_MAX - EXPLORE_THRUST_INTERVAL_MIN);
                }
                
                // Limit max speed
                const speed = Math.sqrt(pixel.vx * pixel.vx + pixel.vy * pixel.vy);
                if (speed > MAX_SPEED) {
                    pixel.vx = (pixel.vx / speed) * MAX_SPEED;
                    pixel.vy = (pixel.vy / speed) * MAX_SPEED;
                }
                
                // Apply slight drag
                pixel.vx *= DRAG;
                pixel.vy *= DRAG;
                
                // Update position
                pixel.x += pixel.vx;
                pixel.y += pixel.vy;
                
                // Soft boundaries - push back gently if near edge
                if (pixel.x < SOFT_BOUNDARY) pixel.vx += SOFT_BOUNDARY_PUSH;
                if (pixel.x > viewWidth - SOFT_BOUNDARY) pixel.vx -= SOFT_BOUNDARY_PUSH;
                if (pixel.y < SOFT_BOUNDARY) pixel.vy += SOFT_BOUNDARY_PUSH;
                if (pixel.y > viewHeight - SOFT_BOUNDARY) pixel.vy -= SOFT_BOUNDARY_PUSH;
                
                // Hard clamp
                pixel.x = Math.max(0, Math.min(viewWidth - PIXEL_SIZE, pixel.x));
                pixel.y = Math.max(0, Math.min(viewHeight - PIXEL_SIZE, pixel.y));
            });
            
            updatePlumes();
            
            // Update click repel state
            updateClickRepel();
            
            draw();
            
            requestAnimationFrame(animate);
        }
        
        function draw() {
            if (spriteDpr !== dpr) {
                renderSprite();
                spriteDpr = dpr;
            }
            
            ctx.clearRect(0, 0, viewWidth, viewHeight);
            
            // Plumes sit beneath the pixels
            ctx.fillStyle = GLOW_COLOR;
            plumes.forEach(plume => {
                ctx.globalAlpha = Math.max(0, plume.opacity);
                ctx.fillRect(plume.x, plume.y, PLUME_SIZE, PLUME_SIZE);
            });
            ctx.globalAlpha = 1;
            
            pixels.forEach(pixel => {
                ctx.drawImage(sprite, pixel.x - GLOW_PAD, pixel.y - GLOW_PAD, SPRITE_SIZE, SPRITE_SIZE);
            });
        }
        
        // Create thrust plume particles
        function createPlume(x, y, dx, dy) {
            plumes.push({
                x: x,
                y: y,
                vx: -dx * PLUME_VELOCITY_MULT + (Math.random() - 0.5) * PLUME_SPREAD,
                vy: -dy * PLUME_VELOCITY_MULT + (Math.random() - 0.5) * PLUME_SPREAD,
                opacity: 1,
                life: PLUME_LIFE
            });
        }
        
        function updatePlumes() {
            for (let i = plumes.length - 1; i >= 0; i--) {
                const plume = plumes[i];
                plume.x += plume.vx;
                plume.y += plume.vy;
                plume.opacity -= PLUME_FADE_RATE;
                plume.life--;
                if (plume.life <= 0) {
                    // Swap-remove: order doesn't matter for drawing
                    plumes[i] = plumes[plumes.length - 1];
                    plumes.pop();
                }
            }
        }
        
        animate();
        
    </script>
</body>
</html>
